    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  node2:
    build: .
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - PEER=http://node1:5001

  node3:
    build: .
    ports:
      - "5003:5003"
