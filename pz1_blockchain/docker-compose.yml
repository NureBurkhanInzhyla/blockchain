      - PORT=5003
      - PEER=http://node1:5001

  node4:
    build: .
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - PEER=http://node1:5001

  node5:
    build: .
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - PEER=http://node1:5001